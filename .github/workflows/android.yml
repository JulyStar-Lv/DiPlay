name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Check vehicle display module boundaries
        run: python3 scripts/check_vehicle_display_boundaries.py
      - name: Check HUD bench evidence helper
        run: python3 -m unittest discover -s scripts -p 'test_hud*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        env:
          DIPLAY_SCREENSHOT_DIR: ${{ github.workspace }}/common/build/reports/swipe-menu-ui
        run: ./gradlew :display-api:test :display-android:testDebugUnitTest :display-android:lintDebug :display-android:assembleDebug :vehicle-mzd:testDebugUnitTest :vehicle-mzd:lintDebug :vehicle-mzd:assembleDebug :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mazda:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug :mazda:lintDebug :mazda:assembleDebug :mazda:compileReleaseKotlin :mazda:processReleaseManifest --stacktrace
      - name: Check OEM APK inclusion
        run: python3 scripts/check_vehicle_display_boundaries.py --apks --release
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            display-api/build/reports/tests/
            display-android/build/reports/tests/
            vehicle-mzd/build/reports/tests/
            vehicle-mzd/build/reports/lint-results-debug.html
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            common/build/reports/black-corner-ui/
            common/build/reports/mazda-ui/
            common/build/reports/swipe-menu-ui/
            common/build/reports/wheel-media-ui/
            mobile/build/reports/lint-results-debug.html
            mazda/build/reports/lint-results-debug.html
            mazda/build/reports/tests/
            mazda/build/reports/route-replay/
            mazda/build/reports/hud-native-map/
            mazda/build/reports/mazda-ui/
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
